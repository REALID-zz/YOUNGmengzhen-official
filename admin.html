<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin — DCT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#111;--border:#222;--accent:#adcb41;--text:#ccc;--dim:#666;--sans:system-ui,-apple-system,sans-serif}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}

/* Gate */
#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:18px}
#gate h1{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:400}
#gate input{background:transparent;border:1px solid var(--border);color:#fff;padding:12px 20px;font-size:16px;text-align:center;letter-spacing:.3em;width:200px;border-radius:0;outline:none}
#gate input:focus{border-color:var(--accent)}
#gate .err{color:#e44;font-size:12px;min-height:18px}

/* Panel */
#panel{display:none;max-width:960px;margin:0 auto;padding:24px 20px 80px}
.topBar{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:32px}
.topBar h1{font-size:13px;letter-spacing:.16em;font-weight:700;color:#fff}
.topBar .exit{background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;font-size:11px;letter-spacing:.1em}
.topBar .exit:hover{border-color:var(--accent);color:var(--accent)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:28px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:10px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:.2s}
.tabs button:hover{color:#fff}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

.tabContent{display:none}
.tabContent.active{display:block}

/* Section headers */
.secHead{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#fff;margin-bottom:18px}
.secSub{font-size:12px;color:var(--dim);margin-bottom:24px}

/* Upload */
.catSelect{display:flex;gap:8px;margin-bottom:18px}
.catSelect button{padding:8px 16px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;letter-spacing:.06em;transition:.2s}
.catSelect button:hover{border-color:#555;color:#fff}
.catSelect button.active{border-color:var(--accent);color:var(--accent);background:rgba(173,203,65,.06)}

.dropzone{border:1px dashed var(--border);padding:48px 24px;text-align:center;color:var(--dim);font-size:13px;cursor:pointer;transition:.2s;margin-bottom:20px;position:relative}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--accent)}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer}

.queue{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.queueItem{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);background:var(--card)}
.queueItem img{width:48px;height:48px;object-fit:cover}
.queueItem .name{flex:1;font-size:12px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queueItem .size{font-size:11px;color:var(--dim);min-width:60px;text-align:right}
.queueItem .status{font-size:11px;min-width:50px;text-align:right}
.queueItem .status.ok{color:var(--accent)}
.queueItem .status.err{color:#e44}
.queueItem .status.up{color:#6af}

.uploadBtn{background:var(--accent);color:#000;border:none;padding:10px 28px;font-size:12px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;transition:.2s}
.uploadBtn:hover{opacity:.85}
.uploadBtn:disabled{opacity:.3;cursor:not-allowed}

/* Works grid */
.worksGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:20px}
.workCard{position:relative;border:1px solid var(--border);background:var(--card);overflow:hidden}
.workCard img,.workCard video{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.workCard .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#e44;border:1px solid #e44;width:22px;height:22px;font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer}
.workCard:hover .del{display:flex}

/* Module toggles */
.moduleList{display:flex;flex-direction:column;gap:2px}
.moduleRow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--border);background:var(--card)}
.moduleRow .label{font-size:13px;color:#fff}
.moduleRow .desc{font-size:11px;color:var(--dim);margin-top:2px}
.toggle{position:relative;width:40px;height:22px;cursor:pointer}
.toggle input{display:none}
.toggle span{position:absolute;inset:0;background:#333;border-radius:11px;transition:.2s}
.toggle span::after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;background:#666;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{left:20px;background:#fff}

.saveBtn{margin-top:20px;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:10px 28px;font-size:12px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;transition:.2s}
.saveBtn:hover{background:var(--accent);color:#000}

/* GitHub config */
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field input{width:100%;background:transparent;border:1px solid var(--border);color:#fff;padding:10px 14px;font-size:13px;outline:none}
.field input:focus{border-color:var(--accent)}
.field .hint{font-size:11px;color:var(--dim);margin-top:4px}
.testBtn{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 20px;font-size:12px;letter-spacing:.06em;transition:.2s}
.testBtn:hover{border-color:var(--accent);color:var(--accent)}
.connStatus{margin-top:12px;font-size:12px;min-height:20px}
.connStatus.ok{color:var(--accent)}
.connStatus.err{color:#e44}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 24px;font-size:12px;letter-spacing:.04em;border:1px solid var(--border);opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

@media(max-width:600px){
  .worksGrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .catSelect{flex-wrap:wrap}
  .tabs button{padding:8px 10px;font-size:11px}
}
</style>
</head>
<body>

<div id="gate">
  <h1>Management Console</h1>
  <input type="password" id="pinInput" placeholder="PIN" autofocus/>
  <div class="err" id="pinErr"></div>
</div>

<div id="panel">
  <div class="topBar">
    <h1>DCT — Admin</h1>
    <button class="exit" onclick="location.href='./'">← Back to Site</button>
  </div>

  <div class="tabs">
    <button class="active" data-tab="upload">作品管理</button>
    <button data-tab="modules">模块设置</button>
    <button data-tab="github">GitHub 配置</button>
  </div>

  <!-- Upload -->
  <div class="tabContent active" id="tab-upload">
    <h2 class="secHead">上传新作品</h2>
    <p class="secSub">选择分类，拖入文件即可上传到网站。上传后约 1-2 分钟自动生效。</p>

    <div class="catSelect">
      <button class="active" data-cat="works">Fine Art</button>
      <button data-cat="digital">Digital</button>
      <button data-cat="visuals">Visuals</button>
    </div>

    <div class="dropzone" id="dropzone">
      拖拽图片 / 视频到此处，或点击选择文件
      <input type="file" id="fileInput" multiple accept="image/*,video/*"/>
    </div>

    <div class="queue" id="queue"></div>
    <button class="uploadBtn" id="uploadBtn" disabled>上传全部</button>

    <h2 class="secHead" style="margin-top:40px">当前作品</h2>
    <div class="catSelect" id="browseCat">
      <button class="active" data-cat="works">Fine Art</button>
      <button data-cat="digital">Digital</button>
      <button data-cat="visuals">Visuals</button>
    </div>
    <div class="worksGrid" id="worksGrid"></div>
  </div>

  <!-- Modules -->
  <div class="tabContent" id="tab-modules">
    <h2 class="secHead">模块显示设置</h2>
    <p class="secSub">控制网站各区块的显示 / 隐藏。保存后约 1-2 分钟生效。</p>
    <div class="moduleList" id="moduleList"></div>
    <button class="saveBtn" id="saveModules">保存设置</button>
  </div>

  <!-- GitHub -->
  <div class="tabContent" id="tab-github">
    <h2 class="secHead">GitHub 连接</h2>
    <p class="secSub">设置 Personal Access Token 以启用作品上传和模块管理功能。</p>

    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx"/>
      <div class="hint">前往 GitHub → Settings → Developer settings → Personal access tokens → 生成 (需要 repo 权限)</div>
    </div>
    <div class="field">
      <label>仓库</label>
      <input id="repoInput" value="REALID-zz/YOUNGmengzhen-official"/>
    </div>
    <button class="testBtn" id="testBtn">测试连接</button>
    <div class="connStatus" id="connStatus"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PIN_KEY = 'dct_admin_pin';
const TOKEN_KEY = 'dct_gh_token';
const REPO_KEY = 'dct_gh_repo';
const DEFAULT_REPO = 'REALID-zz/YOUNGmengzhen-official';

const MODULES = [
  { id: 'visuals',       label: 'VISUALS 视觉交互区', desc: '激光动画 + 音频引擎' },
  { id: 'works',         label: 'FINE ART 画廊',      desc: '油画 / 绘画作品展示' },
  { id: 'about',         label: 'ABOUT 关于',         desc: '个人简介与链接' },
  { id: 'highlights',    label: 'HIGHLIGHTS 亮点',    desc: '荣誉与成就展示' },
  { id: 'references',    label: 'REFERENCES 引用',    desc: '媒体报道与外部链接' },
  { id: 'faq',           label: 'FAQ 常见问题',       desc: '问答折叠区' },
  { id: 'contact',       label: 'CONTACT 联系',       desc: '邮箱与联系方式' },
  { id: 'dockDigital',   label: 'DIGITAL 按钮',       desc: '数字作品入口按钮' },
  { id: 'dockThings',    label: 'THINGS 按钮',        desc: 'YouTube 记录视频入口' },
  { id: 'dockInterview', label: 'INTERVIEW 按钮',     desc: '采访视频入口' },
];

let uploadQueue = [];
let currentCat = 'works';
let browseCat = 'works';

function toast(msg, dur = 2500){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function getRepo(){ return localStorage.getItem(REPO_KEY) || DEFAULT_REPO; }

async function ghAPI(path, opts = {}){
  const token = getToken();
  if (!token) throw new Error('未设置 GitHub Token');
  const base = `https://api.github.com/repos/${getRepo()}`;
  const res = await fetch(`${base}${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  if (!res.ok){
    const txt = await res.text();
    throw new Error(`GitHub ${res.status}: ${txt.slice(0, 200)}`);
  }
  return res.json();
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ── PIN Gate ── */
const gate = document.getElementById('gate');
const panel = document.getElementById('panel');
const pinInput = document.getElementById('pinInput');
const pinErr = document.getElementById('pinErr');

const storedPin = localStorage.getItem(PIN_KEY);

pinInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const val = pinInput.value.trim();
  if (!val){ pinErr.textContent = '请输入密码'; return; }
  if (!storedPin){
    localStorage.setItem(PIN_KEY, val);
    unlock();
  } else if (val === storedPin){
    unlock();
  } else {
    pinErr.textContent = '密码错误';
    pinInput.value = '';
  }
});

if (!storedPin){
  document.querySelector('#gate h1').textContent = '首次使用 — 请设置管理密码';
}

function unlock(){
  gate.style.display = 'none';
  panel.style.display = 'block';
  initPanel();
}

/* ── Tabs ── */
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabContent').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ── Category selectors ── */
document.querySelectorAll('.catSelect').forEach(group => {
  group.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (group.id === 'browseCat'){
        browseCat = btn.dataset.cat;
        loadWorks(browseCat);
      } else {
        currentCat = btn.dataset.cat;
      }
    });
  });
});

/* ── Drag & Drop ── */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const queueEl = document.getElementById('queue');
const uploadBtn = document.getElementById('uploadBtn');

['dragenter','dragover'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.add('over'); }));
['dragleave','drop'].forEach(e => dropzone.addEventListener(e, ev => { ev.preventDefault(); dropzone.classList.remove('over'); }));

dropzone.addEventListener('drop', ev => addFiles(ev.dataTransfer.files));
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

function addFiles(files){
  for (const f of files){
    if (uploadQueue.find(q => q.file.name === f.name)) continue;
    const url = URL.createObjectURL(f);
    uploadQueue.push({ file: f, preview: url, status: 'pending' });
  }
  renderQueue();
}

function renderQueue(){
  queueEl.innerHTML = '';
  uploadQueue.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'queueItem';
    const isVid = item.file.type.startsWith('video');
    div.innerHTML = `
      ${isVid ? '<video src="'+item.preview+'" style="width:48px;height:48px;object-fit:cover"></video>' : '<img src="'+item.preview+'"/>'}
      <span class="name">${item.file.name}</span>
      <span class="size">${(item.file.size/1024/1024).toFixed(1)} MB</span>
      <span class="status ${item.status === 'done' ? 'ok' : item.status === 'error' ? 'err' : item.status === 'uploading' ? 'up' : ''}">${
        item.status === 'done' ? '✓' : item.status === 'error' ? '✗' : item.status === 'uploading' ? '...' : '待上传'
      }</span>
    `;
    queueEl.appendChild(div);
  });
  uploadBtn.disabled = !uploadQueue.some(q => q.status === 'pending');
}

uploadBtn.addEventListener('click', async () => {
  if (!getToken()){ toast('请先在 GitHub 配置中设置 Token'); return; }
  uploadBtn.disabled = true;
  for (const item of uploadQueue){
    if (item.status !== 'pending') continue;
    item.status = 'uploading'; renderQueue();
    try {
      const content = await fileToBase64(item.file);
      const path = `assets/${currentCat}/${item.file.name}`;
      await ghAPI(`/contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `Upload ${item.file.name}`, content })
      });
      item.status = 'done';
    } catch (e){
      item.status = 'error';
      console.error(e);
    }
    renderQueue();
  }
  uploadQueue = uploadQueue.filter(q => q.status !== 'done');
  renderQueue();
  toast('上传完成，约 1-2 分钟后网站自动更新');
  loadWorks(browseCat);
});

/* ── Load current works ── */
async function loadWorks(cat){
  const grid = document.getElementById('worksGrid');
  grid.innerHTML = '<span style="color:var(--dim);font-size:12px">加载中...</span>';
  try {
    const files = await ghAPI(`/contents/assets/${cat}`);
    const media = files.filter(f => /\.(jpe?g|png|gif|webp|mp4|webm|mov)$/i.test(f.name));
    grid.innerHTML = '';
    if (!media.length){ grid.innerHTML = '<span style="color:var(--dim);font-size:12px">暂无作品</span>'; return; }
    for (const f of media){
      const card = document.createElement('div');
      card.className = 'workCard';
      const isVid = /\.(mp4|webm|mov)$/i.test(f.name);
      const src = f.download_url;
      card.innerHTML = `
        ${isVid ? '<video src="'+src+'" muted></video>' : '<img src="'+src+'" loading="lazy"/>'}
        <button class="del" title="删除" data-path="${f.path}" data-sha="${f.sha}">×</button>
      `;
      card.querySelector('.del').addEventListener('click', async function(){
        if (!confirm(`确认删除 ${f.name}？`)) return;
        try {
          await ghAPI(`/contents/${this.dataset.path}`, {
            method: 'DELETE',
            body: JSON.stringify({ message: `Delete ${f.name}`, sha: this.dataset.sha })
          });
          toast('已删除 ' + f.name);
          loadWorks(cat);
        } catch(e){ toast('删除失败: ' + e.message); }
      });
      grid.appendChild(card);
    }
  } catch(e){
    grid.innerHTML = '<span style="color:#e44;font-size:12px">加载失败 — 请检查 GitHub Token</span>';
  }
}

/* ── Modules ── */
let moduleConfig = {};

async function loadModuleConfig(){
  try {
    const res = await ghAPI('/contents/site-config.json');
    const content = atob(res.content.replace(/\n/g, ''));
    moduleConfig = JSON.parse(content);
    moduleConfig._sha = res.sha;
  } catch(e){
    moduleConfig = { modules: {} };
    MODULES.forEach(m => moduleConfig.modules[m.id] = !['highlights','references','faq'].includes(m.id));
  }
  renderModules();
}

function renderModules(){
  const list = document.getElementById('moduleList');
  list.innerHTML = '';
  for (const m of MODULES){
    const on = moduleConfig.modules[m.id] !== false;
    const row = document.createElement('div');
    row.className = 'moduleRow';
    row.innerHTML = `
      <div>
        <div class="label">${m.label}</div>
        <div class="desc">${m.desc}</div>
      </div>
      <label class="toggle">
        <input type="checkbox" data-mid="${m.id}" ${on ? 'checked' : ''}/>
        <span></span>
      </label>
    `;
    list.appendChild(row);
  }
}

document.getElementById('saveModules').addEventListener('click', async () => {
  if (!getToken()){ toast('请先设置 GitHub Token'); return; }
  const checks = document.querySelectorAll('#moduleList input[type=checkbox]');
  checks.forEach(c => { moduleConfig.modules[c.dataset.mid] = c.checked; });
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(moduleConfig, ['modules', ...MODULES.map(m=>m.id)], 2))));
  try {
    const opts = {
      method: 'PUT',
      body: JSON.stringify({
        message: 'Update site-config.json',
        content,
        ...(moduleConfig._sha ? { sha: moduleConfig._sha } : {})
      })
    };
    const res = await ghAPI('/contents/site-config.json', opts);
    moduleConfig._sha = res.content.sha;
    toast('模块设置已保存，约 1-2 分钟后生效');
  } catch(e){ toast('保存失败: ' + e.message); }
});

/* ── GitHub Config ── */
const tokenInput = document.getElementById('tokenInput');
const repoInput = document.getElementById('repoInput');
const testBtn = document.getElementById('testBtn');
const connStatus = document.getElementById('connStatus');

tokenInput.value = getToken();
repoInput.value = getRepo();

tokenInput.addEventListener('change', () => { localStorage.setItem(TOKEN_KEY, tokenInput.value.trim()); });
repoInput.addEventListener('change', () => { localStorage.setItem(REPO_KEY, repoInput.value.trim()); });

testBtn.addEventListener('click', async () => {
  connStatus.textContent = '连接中...'; connStatus.className = 'connStatus';
  localStorage.setItem(TOKEN_KEY, tokenInput.value.trim());
  localStorage.setItem(REPO_KEY, repoInput.value.trim());
  try {
    const repo = await ghAPI('');
    connStatus.textContent = `✓ 已连接 — ${repo.full_name} (${repo.private ? '私有' : '公开'})`;
    connStatus.className = 'connStatus ok';
    toast('GitHub 连接成功');
  } catch(e){
    connStatus.textContent = '✗ 连接失败: ' + e.message.slice(0, 100);
    connStatus.className = 'connStatus err';
  }
});

/* ── Init ── */
function initPanel(){
  if (getToken()){
    loadWorks(browseCat);
    loadModuleConfig();
  }
}
</script>
</body>
</html>
